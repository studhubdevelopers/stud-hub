name: Deploy StudHub Pages

on:
  push:
    branches:
      - main
      - test

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ github.ref_name == 'main' && 'https://studhub-io.ru' || format('https://studhubdevelopers.github.io/{0}', github.event.repository.name) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ЕСЛИ ЭТО ВЕТКА MAIN: создаем файл CNAME для привязки домена
      - name: Create CNAME for production
        if: github.ref_name == 'main'
        run: echo "studhub-io.ru" > ./CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
